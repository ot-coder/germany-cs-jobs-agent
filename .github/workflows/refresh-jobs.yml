name: Refresh jobs and deploy dashboard

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. Running at 06:00 and 07:00 lets the gate below
    # select 08:00 Europe/Berlin across daylight-saving changes.
    - cron: "0 6,7 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: jobs-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Select the 08:00 Europe/Berlin scheduled run
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          manual = os.environ["EVENT_NAME"] == "workflow_dispatch"
          berlin_hour = datetime.now(ZoneInfo("Europe/Berlin")).hour
          should_run = manual or berlin_hour == 8
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"run={'true' if should_run else 'false'}\n")
          print(f"manual={manual}, Europe/Berlin hour={berlin_hour}, run={should_run}")
          PY

      - name: Run behavior tests
        if: steps.gate.outputs.run == 'true'
        run: python -m unittest discover -s tests -v

      - name: Fetch live jobs and build static dashboard
        if: steps.gate.outputs.run == 'true'
        run: >-
          python -m jobs_agent publish
          --docs docs
          --message .out/telegram.txt
          --site-url https://ot-coder.github.io/germany-cs-jobs-agent/

      - name: Send Telegram update when new jobs exist
        if: steps.gate.outputs.run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -s .out/telegram.txt ] && [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            python -m jobs_agent.telegram
          elif [ -s .out/telegram.txt ]; then
            echo "New jobs found, but Telegram secrets are not configured yet."
          else
            echo "No new jobs; notification skipped."
          fi

      - name: Commit refreshed job data
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "jobs-agent[bot]"
          git config user.email "jobs-agent[bot]@users.noreply.github.com"
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh live job listings"
            git push
          else
            echo "No dashboard changes to commit."
          fi

      - name: Configure GitHub Pages
        if: steps.gate.outputs.run == 'true'
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy dashboard
        if: steps.gate.outputs.run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
